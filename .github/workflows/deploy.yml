name: Auto Deploy to Production Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取 GitHub 仓库最新代码
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. 安装 Node.js 18 环境并编译前端产物
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install & Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    # 3. 将编译好的 dist 静态文件打包同步到服务器 Nginx 目录
    - name: Deploy Frontend Dist via rsync
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        ARGS: "-avzr --delete"
        SERVER_PORT: "22"
        REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USER }}
        TARGET: "/www/wwwroot/jdenergy-support.tech/frontend/dist"
        SOURCE: "frontend/dist/"

    # 4. 同步后端 FastAPI 代码并平滑重启 Uvicorn / 后端进程
    - name: Deploy Backend Code
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # 确保服务器目录存在并拉取最新后端代码
          if [ -d "/www/wwwroot/jdenergy-support.tech/backend" ]; then
            cd /www/wwwroot/jdenergy-support.tech/backend
            git pull || true
          fi
